services:
  database:
    image: timescale/timescaledb:latest-pg17
    container_name: bourse-database
    command: postgres -c shared_preload_libraries=timescaledb
    networks: [ boursenet ]
    ports:
      - "5432:5432"
    environment:
      - PGDATA=/var/lib/postgresql/data/timescaledb
      - POSTGRES_DB=bourse
      - POSTGRES_USER=bourse
      - POSTGRES_PASSWORD=password
    volumes:
      - /tmp/bourse/timescaledb:/var/lib/postgresql/data/timescaledb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bourse -d bourse" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bourse-dashboard
    depends_on:
      database:
        condition: service_healthy
    networks: [ boursenet ]
    ports:
      - "8050:8050"
    environment:
      - DB_HOST=database
      - DATADIR=/mnt/data
    restart: unless-stopped
    volumes:
      - ./euronext:/mnt/data/euronext
      - ./bourso:/mnt/data/boursorama

networks:
  boursenet:
    driver: bridge
